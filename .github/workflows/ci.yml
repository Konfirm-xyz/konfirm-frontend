name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` runs its own full TypeScript check as part of the
      # build — a standalone `tsc --noEmit` step run before this would fail
      # on a clean checkout, since App Router's generated route types (e.g.
      # `LayoutProps`) only exist under .next/types once a build or dev
      # server has produced them at least once.
      #
      # BACKEND_URL isn't needed for the build itself — next.config.ts's
      # rewrites() only reads it at request time, not build time — but
      # setting it keeps the env consistent with how this app actually runs.
      - name: Build (includes type check)
        run: npm run build
        env:
          BACKEND_URL: http://localhost:4001

  # Split out from `build` (2026-11-14): dependency-vulnerability findings
  # are a real, tracked problem (frontend#231) but a different kind of
  # problem than "does this PR's own code work" — bundling them into one
  # required check meant any PR, including one that never touches a
  # dependency, was blocked by a pre-existing audit finding it didn't
  # cause. This job still runs and still fails loudly on a high-severity
  # finding; it's just not in branch protection's required list, so it
  # can't block an unrelated PR. The finding itself still has to get fixed
  # via frontend#231 — this doesn't lower the bar, it just stops gating
  # unrelated work on it.
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A high-severity finding fails this job; moderate findings are
      # visible in the log without blocking every push on them.
      - name: Audit dependencies
        run: npm audit --audit-level=high
